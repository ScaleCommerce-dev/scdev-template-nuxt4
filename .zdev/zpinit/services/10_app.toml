# The Nuxt dev server, supervised by zpinit (mode 3 — the image has no CMD).
#
# Runs after entrypoint.d/ (dependency install) has completed. If it crashes,
# zpinit restarts it with backoff; after 5 consecutive crashes it lands in FATAL
# and stops retrying — but zpinit stays PID 1 either way, so the CONTAINER STAYS
# UP and `zdev exec` / `zdev module add` keep working. That's the whole point of
# supervising instead of running the server as the container CMD: a bad
# nuxt.config.ts (e.g. a module referenced but not installed) no longer bricks
# the container. Recover in place, then `zpctl restart app` (or `zdev restart`).
#
# No [ready] probe: a dev server doesn't gate anything downstream, and its first
# compile can be slow — we don't want boot_timeout to fire on it.
command = ["pnpm", "dev"]
cwd = "/app"
restart = "always"

# on_boot_failure = "continue": the third piece of the recoverability
# chain, alongside supervise mode and entrypoint_on_failure = "continue"
# in zpinit.toml. Without it, a dev server that cannot even START on a
# COLD boot (no node_modules because the install failed, a syntax error
# in nuxt.config.ts) fails zpinit's initial boot after boot_timeout, and
# the default "fail" exits the container anyway. That undoes the other
# two pieces: the container is a brick again, exactly in the situation
# they exist to survive. With "continue" PID 1 stays up, the failure
# shows in `zpctl status` (BACKOFF / FATAL) and the logs, and you repair
# via `zdev exec` then `zpctl restart app`.
#
# A WARM boot hides this: the service reaches RUNNING, boot completes,
# and a later crash never touches the container. Test cold.
on_boot_failure = "continue"
